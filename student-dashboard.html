<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="styles/student-dashboard.css">
</head>
<body>

<div class="screen">

  <header class="header">
    <h1>CampusCheck</h1>
  </header>

  <section class="check-card">
    <div class="card-top">
      <h2 id="welcomeName"></h2>
      <p>10 March</p>
    </div>

    <h3>Scan class QR</h3>

    <button class="check-btn">Check-in</button>
  </section>

  <section class="activity-title">
    <h3>Campus Activity</h3>
    <p>March</p>
  </section>

  <section class="activity-card">
    <div class="circle">
      <span>5</span>
      <p>Days this<br>month</p>
    </div>

    <div class="legend">
      <p><span class="green-text">4</span> Class days</p>
      <p><span class="orange-text">1</span> Bonus visits</p>
    </div>
  </section>

  <nav class="bottom-nav">

    <img src="images/icon_home_orange.png" class="nav-icon">
    <img src="images/icon_calender.png" class="nav-icon">
    <img src="images/icon_settings.png" class="nav-icon">

</nav>

</div>
<script src="javascript/student-dashboard.js"></script>
</body>
</html>
