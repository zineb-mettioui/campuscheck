<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="styles/teacher-dashboard.css">
</head>
<body>

<div class="screen">

  <header class="header">
    <h1>CampusCheck</h1>
  </header>

  <section class="check-card">
    <div class="card-top">
      <h2 id="teacherWelcome"></h2>
      <p>10 March</p>
    </div>

    <h3>Generate a QR code for your class <br> so students can check-in.</h3>

    <button class="check-btn" onclick="openClassPopup()">
  Generate QR</button>
  </section>

  <section class="activity-title">
    <h3>Today's attendance</h3>
    <p>March</p>
  </section>
<section class="attendance-card">

  <div class="student-row">
    <div class="avatar"></div>
    <div class="student-info">
      <h4>Zineb Mettioui</h4>
      <p>09:12 AM</p>
    </div>
    <span class="check-icon">✔</span>
  </div>

  <div class="student-row">
    <div class="avatar"></div>
    <div class="student-info">
      <h4>Elena Roos</h4>
      <p>09:15 AM</p>
    </div>
    <span class="check-icon">✔</span>
  </div>

  <div class="student-row">
    <div class="avatar"></div>
    <div class="student-info">
      <h4>Adam Janssens</h4>
      <p>09:18 AM</p>
    </div>
    <span class="check-icon">✔</span>
  </div>

  <div class="attendance-total">
    👥 6 students checked in
  </div>

</section>
 <nav class="bottom-nav">

    <img src="images/icon_home_green.png" class="nav-icon">
    <img src="images/icon_calender.png" class="nav-icon">
    <img src="images/icon_settings.png" class="nav-icon">

</nav>
<div id="classOverlay" class="qr-overlay">

  <div class="qr-box">

    <h2>Select Class</h2>

    <select id="lessonSelect" class="lesson-select">

      <option value="Interactive Web / 1 XD">
        Interactive Web / 1 XD
      </option>

      <option value="Backend-end / 2 XD">
        Backend-end /  2 XD
      </option>

      <option value="Lab 4 / 2 XD">
        Lab 4 /  2 XD
      </option>

    </select>

    <button class="scan-btn" onclick="generateQR()">
      Create QR
    </button>

    <button class="cancel-btn" onclick="closeClassPopup()">
      Cancel
    </button>

  </div>

</div>
<div id="qrOverlay" class="qr-overlay">

  <div class="qr-box">

    <h2>Class QR Code</h2>

    <p id="selectedLesson"></p>

    <div class="fake-qr">

      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>

    </div>

    <p class="lesson-code" id="lessonCode"></p>

    <button class="close-btn" onclick="closeQR()">
      Close
    </button>

  </div>

</div>
</div>
<script src="javascript/teacher-dashboard.js"></script>
</body>
</html>
